name: "Terraform Infrastructure Change Management Pipeline with GitHub Actions"
 
on:
 pull_request:
   branches:
   - main
   paths:
   - terraform/**
 
env:
 TF_LOG: INFO
 # Credentials for deployment to AWS
 AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
 AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
 AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}


jobs:
 terraform:
   name: "Terraform Infrastructure Change Management"
   runs-on: ubuntu-latest
   defaults:
     run:
       shell: bash
       # We keep Terraform files in the terraform directory.
       working-directory: ./terraform
 
   steps:
     - name: Checkout the repository to the runner
       uses: actions/checkout@v2
 
     - name: Setup Terraform with specified version on the runner
       uses: hashicorp/setup-terraform@v2
       with:
         terraform_version: 1.3.0
    
     - name: Generate Terraform Plan
       run: |
         terraform init
         terraform validate
         terraform plan -out=tfplan.binary
         terraform show -json tfplan.binary | grep -v "^::" | grep -v "^\[" | grep -v "^2025" | grep -v "^::debug" > tfplan.json

    #  - name: Read and encode tfplan.json
    #    id: read-plan
    #    run: |
         PLAN_CONTENT=$(cat tfplan.json | tr -d '\n' | base64 -w 0)
         echo "PLAN_CONTENT<<EOF" >> $GITHUB_ENV
         echo "$PLAN_CONTENT" >> $GITHUB_ENV
         echo "EOF" >> $GITHUB_ENV

     - name: POST REST API Call
       uses: fjogeleit/http-request-action@v1
       with:
         url: ${{ secrets.WEBHOOK_URL }}
         method: POST
         contentType: 'application/json'
         data: '{"plan": "${{ env.PLAN_CONTENT }}"}'
         timeout: 30000
         retry: 3
         retryWait: 5000
 