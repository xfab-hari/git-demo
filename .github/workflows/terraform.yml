name: "Impact Simulation"
 
on:
 pull_request:
   branches:
   - main
   paths:
   - terraform/**
 
env:
 TF_LOG: INFO
 # Credentials for deployment to AWS
 AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
 AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
 AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

jobs:
 terraform:
   name: "Impact Simulation"
   runs-on: ubuntu-latest
   defaults:
     run:
       shell: bash
       # We keep Terraform files in the terraform directory.
       working-directory: ./terraform
 
   steps:
     - name: Checkout the repository to the runner
       uses: actions/checkout@v2
 
     - name: Setup Terraform with specified version on the runner
       uses: hashicorp/setup-terraform@v2
       with:
         terraform_version: 1.3.0
    
     - name: Generate Terraform Plan
       run: |
         terraform init
         terraform validate
         terraform plan -out=tfplan.binary
         terraform show -json tfplan.binary | grep -v "^::" | grep -v "^\[" | grep -v "^2025" | grep -v "^::debug" > tfplan.json
         PLAN_CONTENT=$(cat tfplan.json | tr -d '\n' | base64 -w 0)
         echo "PLAN_CONTENT<<EOF" >> $GITHUB_ENV
         echo "$PLAN_CONTENT" >> $GITHUB_ENV
         echo "EOF" >> $GITHUB_ENV

     - name: Send Plan and Wait for Analysis
       id: send-plan
       run: |
         # Send request and capture response
         response=$(curl -s -w "\n%{http_code}" \
           -X POST \
           -H "Content-Type: application/json" \
           -d '{"plan": "${{ env.PLAN_CONTENT }}"}' \
           "${{ secrets.WEBHOOK_URL }}")
         
         # Split response into body and status code
         status_code=$(echo "$response" | tail -n1)
         body=$(echo "$response" | sed '$d')
         
         # Save response body to file
         echo "$body" > analysis.md
         
         # Print response details
         echo "Response Status Code: $status_code"
         echo "Response Body:"
         echo "$body"
         
         # Exit if status code is not 2xx
         if [[ ! $status_code =~ ^2[0-9]{2}$ ]]; then
           echo "Error: Received non-2xx status code: $status_code"
           exit 1
         fi

     - name: Post Analysis as PR Comment
       uses: actions/github-script@v6
       with:
         script: |
            const fs = require('fs');
            const analysis = fs.readFileSync('analysis.md', 'utf8');
            const prNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            await github.rest.issues.createComment({
              owner: owner,
              repo: repo,
              issue_number: prNumber,
              body: analysis
            });
 