name: "Impact Simulation"

on:
  pull_request:
    branches: [main]
    paths: ["terraform/**"]

# Minimal GitHub token permissions
permissions:
  contents: read          # checkout + read terraform files
  id-token: write         # needed when using OIDC -> Google Cloud
  pull-requests: write    # optional: allows posting PR comments or annotations

# Ensure only one run per PR is active at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_INPUT: "false"        # disable interactive prompts
  TF_LOG: "INFO"           # increase log verbosity for troubleshooting
  TF_CLI_ARGS: "-no-color" # ensure machine‑readable output in logs

jobs:
  impact-simulation:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # faster commits → required for pull_request_target

      - name: Setup Terraform
        id: setup
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.0
          terraform_wrapper: false   # don’t inject the wrapper script; speeds up large plans

      # Cache both the CLI plugin dir and the .terraform folder to speed up repeated runs
      - name: Restore Terraform cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.terraform.d/plugin-cache
            .terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/*.tf') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Detect active providers
        id: detect
        run: |
          terraform init -backend=false
          PROVIDERS=$(terraform providers schema -json | jq -r '.provider_schemas | keys[]')
          echo "has_aws=false"   >>"$GITHUB_OUTPUT"
          echo "has_gcp=false"   >>"$GITHUB_OUTPUT"
          echo "has_azure=false" >>"$GITHUB_OUTPUT"

          [[ "$PROVIDERS" =~ registry\.terraform\.io/hashicorp/aws ]]     && echo "has_aws=true"   >>"$GITHUB_OUTPUT"
          [[ "$PROVIDERS" =~ registry\.terraform\.io/hashicorp/google ]]  && echo "has_gcp=true"  >>"$GITHUB_OUTPUT"
          [[ "$PROVIDERS" =~ registry\.terraform\.io/hashicorp/azurerm ]] && echo "has_azure=true" >>"$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC not yet)
        if: steps.detect.outputs.has_aws == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          role-duration-seconds: 900

      - name: Authenticate to Google Cloud
        id: gcp-auth
        if: steps.detect.outputs.has_gcp == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
          export_environment_variables: true

      - name: Install gcloud CLI
        if: steps.detect.outputs.has_gcp == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Azure Login
        if: steps.detect.outputs.has_azure == 'true'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Generate Terraform plan
        id: plan
        run: |
          terraform init -backend=false
          terraform validate
          terraform plan -out=tfplan.binary
          terraform show -json tfplan.binary | jq -c '.' > tfplan.json
          echo "content=$(base64 -w0 tfplan.json)" >>"$GITHUB_OUTPUT"

      - name: Send plan for Impact Analysis
        env:
          SIMON_GITHUB_ACTIONS_API_USERNAME: ${{ secrets.SIMON_GITHUB_ACTIONS_API_USERNAME }}
          SIMON_GITHUB_ACTIONS_API_PASSWORD: ${{ secrets.SIMON_GITHUB_ACTIONS_API_PASSWORD }}
          PLAN_CONTENT: ${{ steps.plan.outputs.content }}
        run: |
          # A short‑lived ID token signed by Google (populated by the auth step)
          ID_TOKEN=${{ steps.gcp-auth.outputs.id_token }}

          payload=$(jq -n --arg plan "$PLAN_CONTENT" \
                           --arg owner "${{ github.repository_owner }}" \
                           --arg repo  "${{ github.event.repository.name }}" \
                           --arg pr    "${{ github.event.pull_request.number }}" \
                           --arg sha   "${{ github.sha }}" \
                           --arg runid "${{ github.run_id }}" \
                           '{plan:$plan, github_context:{owner:$owner,repo:$repo,pr_number:$pr,commit_sha:$sha,run_id:$runid}}')

          # Post the request
          response=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $ID_TOKEN" \
            -d "$payload" \
            "${{ secrets.WEBHOOK_URL }}")

          status_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "$body"

          if [[ ! "$status_code" =~ ^2[0-9]{2}$ ]]; then
            echo "::error::Impact analysis API returned HTTP $status_code"
            exit 1
          fi
