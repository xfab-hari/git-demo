# Required GitHub Secrets:
# AWS_ACCESS_KEY_ID: AWS access key for authentication
# AWS_SECRET_ACCESS_KEY: AWS secret key for authentication
# AWS_SESSION_TOKEN: AWS session token for temporary credentials
# WEBHOOK_URL: URL endpoint for sending plan for analysis
# GITHUB_TOKEN: Automatically provided by GitHub Actions, no need to set manually
# SIMON_GITHUB_ACTIONS_API_USERNAME: Username for the simulation API
# SIMON_GITHUB_ACTIONS_API_PASSWORD: Password for the simulation API
# GOOGLE_CREDENTIALS: Google Cloud credentials for authentication
# AZURE_CREDENTIALS: Azure service principal credentials JSON

name: "Impact Simulation"
 
on:
 pull_request:
   branches:
   - main
   paths:
   - terraform/**

# Add permissions block
permissions:
  contents: read #doing it explicitly

env:
 TF_LOG: INFO

 # Simon github-actions related API Configuration
#  SIMON_GITHUB_ACTIONS_API_USERNAME: ${{ secrets.SIMON_GITHUB_ACTIONS_API_USERNAME }}
#  SIMON_GITHUB_ACTIONS_API_PASSWORD: ${{ secrets.SIMON_GITHUB_ACTIONS_API_PASSWORD }}

jobs:
 terraform:
   name: "Impact Simulation"
   runs-on: ubuntu-latest
   defaults:
     run:
       shell: bash
       working-directory: ./terraform
 
   steps:
     - name: Checkout repository
       uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

     - name: Setup Terraform
       uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
       with:
         terraform_version: 1.12.0

     - name: Detect Providers
       id: detect
       run: |
         terraform init
         PROVIDERS=$(terraform providers schema -json | jq -r '.provider_schemas | keys[]')
         echo "has_aws=false" >> $GITHUB_OUTPUT
         echo "has_gcp=false" >> $GITHUB_OUTPUT
         echo "has_azure=false" >> $GITHUB_OUTPUT
         
         if echo "$PROVIDERS" | grep -q "registry.terraform.io/hashicorp/aws"; then
           echo "has_aws=true" >> $GITHUB_OUTPUT
         fi
         if echo "$PROVIDERS" | grep -q "registry.terraform.io/hashicorp/google"; then
           echo "has_gcp=true" >> $GITHUB_OUTPUT
         fi
         if echo "$PROVIDERS" | grep -q "registry.terraform.io/hashicorp/azurerm"; then
           echo "has_azure=true" >> $GITHUB_OUTPUT
         fi

     - name: Setup AWS Auth # needs to be verified
       if: steps.detect.outputs.has_aws == 'true'
       uses: aws-actions/configure-aws-credentials@v4
       with:
         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
         aws-region: us-east-1

     - name: Setup Google Cloud Auth # verified
       if: steps.detect.outputs.has_gcp == 'true'
       uses: 'google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193' # v2.1.10
       with:
         credentials_json: '${{ secrets.GOOGLE_CREDENTIALS }}'

     - name: Setup Azure Auth # needs to be verified
       if: steps.detect.outputs.has_azure == 'true'
       uses: azure/login@v1
       with:
         creds: ${{ secrets.AZURE_CREDENTIALS }}
      
     - name: Generate Plan
       run: |
         terraform init
         terraform validate
         terraform plan -no-color -input=false -out=tfplan.binary
         terraform show -json tfplan.binary | grep -v "^::" | grep -v "^\[" | grep -v "^2025" | grep -v "^::debug" > tfplan.json
         PLAN_CONTENT=$(cat tfplan.json | tr -d '\n' | base64 -w 0)
         echo "PLAN_CONTENT<<EOF" >> $GITHUB_ENV
         echo "$PLAN_CONTENT" >> $GITHUB_ENV
         echo "EOF" >> $GITHUB_ENV

     - name: Send plan for Impact Analysis
       id: send-plan
       env:
         SIMON_GITHUB_ACTIONS_API_USERNAME: ${{ secrets.SIMON_GITHUB_ACTIONS_API_USERNAME }}
         SIMON_GITHUB_ACTIONS_API_PASSWORD: ${{ secrets.SIMON_GITHUB_ACTIONS_API_PASSWORD }}
       run: |
         # Create Basic Auth header
         AUTH_HEADER=$(echo -n "$SIMON_GITHUB_ACTIONS_API_USERNAME:$SIMON_GITHUB_ACTIONS_API_PASSWORD" | base64)
         
         # Send request and capture response
         response=$(curl -s -w "\n%{http_code}" \
           -X POST \
           -H "Content-Type: application/json" \
           -H "Authorization: Basic $AUTH_HEADER" \
           -d '{
             "plan": "${{ env.PLAN_CONTENT }}",
             "github_context": {
               "owner": "${{ github.repository_owner }}",
               "repo": "${{ github.event.repository.name }}",
               "pr_number": "${{ github.event.pull_request.number }}",
               "commit_sha": "${{ github.sha }}",
               "run_id": "${{ github.run_id }}"
             }
           }' \
           "${{ secrets.WEBHOOK_URL }}")
         
         # Split response into body and status code
         status_code=$(echo "$response" | tail -n1)
         body=$(echo "$response" | sed '$d')
         
         # Print response details
         echo "Response Status Code: $status_code"
         echo "Response Body:"
         echo "$body"
         
         # Exit if status code is not 2xx
         if [[ ! $status_code =~ ^2[0-9]{2}$ ]]; then
           echo "Error: Received non-2xx status code: $status_code"
           exit 1
         fi